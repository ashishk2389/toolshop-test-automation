[tox]
envlist = py39, py310, py311
skipsdist = true

[testenv]
description = Run framework smoke validation suite via automated environment isolation
setenv =
    PYTHONPATH = {toxinidir}

# ---- UPDATE THIS LINE TO READ FROM REQUIREMENTS.TXT ----
deps =
    -r{toxinidir}/requirements.txt

commands =
    # Installs and configures system browser drivers required for Playwright execution
    playwright install chromium --with-deps
    # Invoking the specific smoke test targeting pattern
    python -m pytest -m smoke --basetemp={envtmpdir} {posargs}