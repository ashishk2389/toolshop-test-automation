name: Automation Core CI Regression & Smoke Suite

# Configured to only allow manual execution from the GitHub Actions tab
on:
  workflow_dispatch:

jobs:
  smoke-test-execution:
    name: Execute Automated Smoke Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10"]
      fail-fast: false

    steps:
      - name: Check out Repository Source Tree
        uses: actions/checkout@v4

      - name: Initialize Python Workspace Environment (${{ matrix.python-version }})
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Configuration Management Pre-requisites
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox

      - name: Run Smoke Suite via Isolated Tox Worker
        run: |
          tox -e py${{ matrix.python-version }} -- -v

      - name: Archive Test Run Artifacts & Screenshots (On Failure Only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts-${{ matrix.python-version }}
          path: |
            test-results/
            **/*.png
            **/*.html
          retention-days: 7